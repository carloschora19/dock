<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Amazon Ember', Arial, sans-serif;
            background: linear-gradient(135deg, #0f1922 0%, #1a2332 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d1d5db;
        }

        .container {
            width: 100%;
            max-width: 580px;
            padding: 20px;
        }

        .login-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #f1f5f9;
            font-weight: 400;
            display: inline;
        }

        .info-link {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            margin-left: 10px;
            cursor: pointer;
        }

        .info-link:hover {
            text-decoration: underline;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 30px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: #64748b;
            font-style: italic;
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #334155;
            color: #64748b;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .btn-signin.active {
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }

        .btn-signin.active:hover {
            background: #2563eb;
        }

        .toggle-section {
            display: flex;
            align-items: center;
            margin-top: 25px;
            padding: 15px 0;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            margin-right: 12px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #475569;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #1e293b;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #3b82f6;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .toggle-label {
            color: #f1f5f9;
            font-size: 14px;
            flex: 1;
        }

        .security-key-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .security-key-text {
            color: #94a3b8;
            font-size: 14px;
        }

        .dropdown-btn {
            background: transparent;
            color: #3b82f6;
            border: 1px solid #3b82f6;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .dropdown-btn:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .quick-links {
            margin-top: 30px;
        }

        .quick-links-header {
            background: transparent;
            border: none;
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 0;
            width: 100%;
            text-align: left;
        }

        .quick-links-header:hover {
            color: #3b82f6;
        }

        .arrow {
            transition: transform 0.3s ease;
        }

        .arrow.open {
            transform: rotate(90deg);
        }

        .quick-links-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .quick-links-content.open {
            max-height: 500px;
        }

        /* Loading and Success Animations */
        .btn-signin.loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .btn-signin.loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-signin.success {
            background: #10b981 !important;
            color: white;
        }

        .btn-signin.success::before {
            content: "✓";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 24px;
            animation: checkmark 0.4s ease forwards;
        }

        @keyframes checkmark {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-45deg);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .login-card.fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
        }

        .container.zoom-out {
            animation: zoomOut 0.6s ease forwards;
        }

        @keyframes zoomOut {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        /* Input animation on focus */
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            animation: inputPulse 0.3s ease;
        }

        @keyframes inputPulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Success overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(16, 185, 129, 0.1);
            display: none;
            z-index: 999;
        }

        .success-overlay.show {
            display: block;
            animation: successFlash 0.6s ease;
        }

        @keyframes successFlash {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        /* Page load animation */
        .container {
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <div class="success-overlay" id="successOverlay"></div>
    <div class="container" id="container">
        <div class="login-card">
            <div class="header">
                <h1>Sign in</h1>
                <a href="#" class="info-link">info</a>
            </div>
            <p class="subtitle">Your credentials are required to access corporate resources.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-signin" id="signinBtn" disabled>Sign in</button>
                <button type="button" class="btn-signin" id="signupBtn" style="margin-top: 10px; background: #475569;" disabled>Sign up</button>
            </form>

            <div id="errorMessage" style="color: #ef4444; margin-top: 15px; font-size: 14px; display: none;"></div>
            <div id="successMessage" style="color: #10b981; margin-top: 15px; font-size: 14px; display: none;"></div>

            <div class="toggle-section">
                <label class="toggle-switch">
                    <input type="checkbox" id="autoSubmit">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">Auto-submit sign in button</span>
                <a href="#" class="info-link">info</a>
            </div>

            <div class="security-key-section">
                <span class="security-key-text">Don't have a security key?</span>
                <button class="dropdown-btn">
                    Sign in options
                    <span>▼</span>
                </button>
            </div>

            <div class="quick-links">
                <button class="quick-links-header" onclick="toggleQuickLinks()">
                    <span class="arrow" id="arrow">▶</span>
                    Quick links
                </button>
                <div class="quick-links-content" id="quickLinksContent">
                    <!-- Add your quick links here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const signinBtn = document.getElementById('signinBtn');
        const signupBtn = document.getElementById('signupBtn');
        const loginForm = document.getElementById('loginForm');
        const autoSubmitCheckbox = document.getElementById('autoSubmit');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', async function() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        });

        // Enable/disable buttons based on input
        function updateButtonState() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (email.length > 0 && password.length > 0) {
                signinBtn.disabled = false;
                signinBtn.classList.add('active');
                signupBtn.disabled = false;
                signupBtn.classList.add('active');
            } else {
                signinBtn.disabled = true;
                signinBtn.classList.remove('active');
                signupBtn.disabled = true;
                signupBtn.classList.remove('active');
            }
        }

        emailInput.addEventListener('input', updateButtonState);
        passwordInput.addEventListener('input', updateButtonState);

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        // Show success message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        // Hide messages
        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Sign in handler
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessages();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (email && password) {
                // Start loading animation
                signinBtn.classList.add('loading');
                signinBtn.disabled = true;
                signupBtn.disabled = true;
                emailInput.disabled = true;
                passwordInput.disabled = true;

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    // Remove loading, add success
                    signinBtn.classList.remove('loading');
                    signinBtn.classList.add('success');
                    signinBtn.textContent = 'Success!';

                    // Show success overlay
                    document.getElementById('successOverlay').classList.add('show');

                    // Get user profile data
                    const username = data.user.email.split('@')[0];
                    localStorage.setItem('username', username);
                    localStorage.setItem('userEmail', data.user.email);

                    // Start fade out animation
                    setTimeout(() => {
                        document.querySelector('.login-card').classList.add('fade-out');

                        // Zoom out container and redirect
                        setTimeout(() => {
                            document.getElementById('container').classList.add('zoom-out');

                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 400);
                        }, 300);
                    }, 600);

                } catch (error) {
                    // Reset button state
                    signinBtn.classList.remove('loading');
                    signinBtn.disabled = false;
                    signupBtn.disabled = false;
                    emailInput.disabled = false;
                    passwordInput.disabled = false;

                    showError(error.message || 'Error al iniciar sesión');
                }
            }
        });

        // Sign up handler
        signupBtn.addEventListener('click', async function() {
            hideMessages();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (email && password) {
                signupBtn.classList.add('loading');
                signinBtn.disabled = true;
                signupBtn.disabled = true;
                emailInput.disabled = true;
                passwordInput.disabled = true;

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    signupBtn.classList.remove('loading');

                    if (data.user && data.user.identities && data.user.identities.length === 0) {
                        showError('Este email ya está registrado. Por favor, inicia sesión.');
                    } else {
                        showSuccess('¡Cuenta creada exitosamente! Verifica tu email para confirmar tu cuenta.');
                    }

                    // Reset form
                    emailInput.disabled = false;
                    passwordInput.disabled = false;
                    signinBtn.disabled = false;
                    signupBtn.disabled = false;

                } catch (error) {
                    signupBtn.classList.remove('loading');
                    signinBtn.disabled = false;
                    signupBtn.disabled = false;
                    emailInput.disabled = false;
                    passwordInput.disabled = false;

                    showError(error.message || 'Error al crear la cuenta');
                }
            }
        });

        // Toggle quick links
        function toggleQuickLinks() {
            const content = document.getElementById('quickLinksContent');
            const arrow = document.getElementById('arrow');
            content.classList.toggle('open');
            arrow.classList.toggle('open');
        }
    </script>
</body>
</html>
